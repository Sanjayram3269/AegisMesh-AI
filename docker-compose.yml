services:
  aegismesh:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - aegis-data:/app/.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ops/status')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aegis-data:

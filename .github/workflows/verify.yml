name: Verify AegisMesh
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests backend/tests -q
  browser:
    runs-on: ubuntu-latest
    env:
      AEGIS_PROVIDER: offline
      AEGIS_DATA_DIR: .local/browser-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run real browser walkthrough
        run: |
          mkdir -p .local
          python run_server.py --port 8765 > .local/browser-server.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/api/ops/status', timeout=1)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Server did not start')
          PY
          python scripts/browser_smoke.py --data-dir .local/browser-ci
          python scripts/verify_console.py --data-dir .local/browser-ci --output .local/console-review
